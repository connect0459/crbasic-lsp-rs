[workspace]
members = [
    "crates/crbasic-parser",
    "crates/crbasic-lsp",
    "crates/crbasic-wasm",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["CRBasic LSP Contributors"]
license = "MIT"
repository = "https://github.com/connect0459/crbasic-lsp-rs"
homepage = "https://github.com/connect0459/crbasic-lsp-rs"

[workspace.dependencies]
# Common dependencies across crates
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

# LSP dependencies
tower-lsp = "0.20"
tokio = { version = "1.35", features = ["full"] }

# WASM dependencies
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Enable link-time optimization
codegen-units = 1   # Reduce parallel codegen units for better optimization
strip = true        # Strip symbols from binary

[profile.release.package.crbasic-wasm]
opt-level = "s"     # Optimize for size (WASM)

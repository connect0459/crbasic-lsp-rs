name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

run-name: Release ${{ github.event_name == 'push' && github.ref_name || 'dry run' }}

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # Re-runs the same quality gates as ci.yml, plus (on a real tag push only)
  # the version/tag consistency check. Runs on workflow_dispatch too so the
  # build/package jobs below can be validated without cutting a release.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check tag matches workspace and client versions
        if: github.event_name == 'push'
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          CLIENT_VERSION="$(node -p "require('./client/package.json').version")"

          if [ "$TAG_VERSION" != "$CARGO_VERSION" ] || [ "$TAG_VERSION" != "$CLIENT_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME ($TAG_VERSION) does not match Cargo.toml ($CARGO_VERSION) and/or client/package.json ($CLIENT_VERSION)."
            exit 1
          fi

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Check Rust formatting
        shell: bash
        run: cargo fmt --all --check

      - name: Run Rust clippy
        shell: bash
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        shell: bash
        run: cargo test --workspace

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        shell: bash
        working-directory: client
        run: npm ci

      - name: Lint client
        shell: bash
        working-directory: client
        run: npm run lint

      - name: Check client formatting
        shell: bash
        working-directory: client
        run: npm run format:check

      - name: Type-check client
        shell: bash
        working-directory: client
        run: npm run type-check

      - name: Run client tests
        shell: bash
        working-directory: client
        run: npm test -- --run

  # Cross-compiles crbasic-lsp for every VS Code platform-specific extension
  # target (https://code.visualstudio.com/api/working-with-extensions/publishing-extension#platformspecific-extensions).
  # linux-* and darwin-* each build both architectures from a single native
  # runner; win32-* does the same via MSVC's built-in ARM64 cross tools.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - vscode_target: linux-x64
            rust_triple: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - vscode_target: linux-arm64
            rust_triple: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            apt_package: gcc-aarch64-linux-gnu
            linker_bin: aarch64-linux-gnu-gcc
          - vscode_target: darwin-x64
            rust_triple: x86_64-apple-darwin
            os: macos-latest
          - vscode_target: darwin-arm64
            rust_triple: aarch64-apple-darwin
            os: macos-latest
          - vscode_target: win32-x64
            rust_triple: x86_64-pc-windows-msvc
            os: windows-latest
          - vscode_target: win32-arm64
            rust_triple: aarch64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cross-compilation linker
        if: matrix.apt_package
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt_package }}

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ matrix.rust_triple }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.rust_triple }}-

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Add Rust target
        shell: bash
        run: rustup target add ${{ matrix.rust_triple }}

      - name: Build crbasic-lsp
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker_bin }}
        run: cargo build --release --target ${{ matrix.rust_triple }} -p crbasic-lsp --bin crbasic-lsp

      - name: Stage binary for upload
        shell: bash
        env:
          VSCODE_TARGET: ${{ matrix.vscode_target }}
        run: |
          mkdir -p dist-bin
          if [[ "$VSCODE_TARGET" == win32-* ]]; then
            cp "target/${{ matrix.rust_triple }}/release/crbasic-lsp.exe" dist-bin/
          else
            cp "target/${{ matrix.rust_triple }}/release/crbasic-lsp" dist-bin/
          fi

      - name: Upload server binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-${{ matrix.vscode_target }}
          path: dist-bin/*
          if-no-files-found: error

  # Packages one .vsix per target and, on a real tag push, creates the
  # GitHub Release. On workflow_dispatch (dry run), the .vsix files are only
  # uploaded as a workflow artifact -- this is how the linux-arm64 and
  # win32-arm64 cross-compilation legs (unverified as of ADR-004) can be
  # validated on real GitHub Actions runners without cutting a release.
  package:
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        shell: bash
        working-directory: client
        run: npm ci

      - name: Download all server binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Move binaries into their cargo target layout
        shell: bash
        run: node client/scripts/place-artifacts.js artifacts target

      - name: Package one .vsix per target
        shell: bash
        working-directory: client
        run: node scripts/package-vsix.js all

      - name: Upload packaged .vsix files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vsix-packages
          path: dist-vsix/*.vsix
          if-no-files-found: error

      - name: Extract changelog section for this version
        if: github.event_name == 'push'
        shell: bash
        run: |
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$RELEASE_VERSION" '
            /^## \[/ { if (capture) exit; if ($0 ~ "\\[" ver "\\]") { capture=1; next } }
            capture { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG.md section found for [$RELEASE_VERSION]. Retitle [Unreleased] to [$RELEASE_VERSION] - YYYY-MM-DD before tagging."
            exit 1
          fi

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: dist-vsix/*.vsix

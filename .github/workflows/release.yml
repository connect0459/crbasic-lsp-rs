name: Release

on:
  push:
    tags:
      - "v*.*.*"

run-name: Release ${{ github.ref_name }}

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check tag matches workspace and client versions
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          CLIENT_VERSION="$(node -p "require('./client/package.json').version")"

          if [ "$TAG_VERSION" != "$CARGO_VERSION" ] || [ "$TAG_VERSION" != "$CLIENT_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME ($TAG_VERSION) does not match Cargo.toml ($CARGO_VERSION) and/or client/package.json ($CLIENT_VERSION)."
            exit 1
          fi

          echo "RELEASE_VERSION=$TAG_VERSION" >> "$GITHUB_ENV"

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Check Rust formatting
        shell: bash
        run: cargo fmt --all --check

      - name: Run Rust clippy
        shell: bash
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        shell: bash
        run: cargo test --workspace

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        shell: bash
        working-directory: client
        run: npm ci

      - name: Lint client
        shell: bash
        working-directory: client
        run: npm run lint

      - name: Check client formatting
        shell: bash
        working-directory: client
        run: npm run format:check

      - name: Type-check client
        shell: bash
        working-directory: client
        run: npm run type-check

      - name: Run client tests
        shell: bash
        working-directory: client
        run: npm test -- --run

      - name: Extract changelog section for this version
        shell: bash
        run: |
          awk -v ver="$RELEASE_VERSION" '
            /^## \[/ { if (capture) exit; if ($0 ~ "\\[" ver "\\]") { capture=1; next } }
            capture { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG.md section found for [$RELEASE_VERSION]. Retitle [Unreleased] to [$RELEASE_VERSION] - YYYY-MM-DD before tagging."
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md

name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

run-name: CI on ${{ github.head_ref || github.ref_name }}

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      crates: ${{ steps.filter.outputs.crates }}
      client: ${{ steps.filter.outputs.client }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            crates:
              - '.github/workflows/ci.yml'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'clippy.toml'
              - 'rustfmt.toml'
            client:
              - '.github/workflows/ci.yml'
              - 'client/**'
              - 'crates/crbasic-parser/keywords.json'
              - 'crates/crbasic-parser/src/keywords_generated.rs'
              - 'scripts/generate-grammar.js'

  crates:
    needs: changes
    if: needs.changes.outputs.crates == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: llvm-tools

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: cargo-llvm-cov

      - name: Check formatting
        shell: bash
        run: cargo fmt --all --check

      - name: Run clippy
        shell: bash
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        shell: bash
        run: cargo test --workspace

      # Branch coverage needs a nightly toolchain and crashed locally with
      # this host's cargo-llvm-cov, so only line/function coverage is gated
      # here.
      - name: Check test coverage
        shell: bash
        run: cargo llvm-cov --workspace --fail-under-lines 80 --fail-under-functions 90

  client:
    needs: changes
    if: needs.changes.outputs.client == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        shell: bash
        run: npm ci

      - name: Lint
        shell: bash
        run: npm run lint

      - name: Check formatting
        shell: bash
        run: npm run format:check

      - name: Type-check
        shell: bash
        run: npm run type-check

      - name: Run tests
        shell: bash
        run: npm run test:run

      - name: Check generated grammar is up to date
        shell: bash
        run: node ../scripts/generate-grammar.js --check

  # Single point of truth for branch protection
  gate:
    runs-on: ubuntu-latest
    needs:
      - changes
      - crates
      - client
    if: always()
    steps:
      - name: Verify all required jobs succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        shell: bash
        run: |
          echo "One or more required jobs did not succeed."
          exit 1
